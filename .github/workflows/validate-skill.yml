name: validate-skill

on: [push, pull_request]

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Validate SKILL.md frontmatter
        run: |
          python - <<'PY'
          import re, sys, yaml

          text = open("SKILL.md", encoding="utf-8").read()
          match = re.match(r"---\n(.*?)\n---\n", text, re.DOTALL)
          if not match:
              sys.exit("SKILL.md: no YAML frontmatter block found")

          try:
              data = yaml.safe_load(match.group(1))
          except yaml.YAMLError as exc:
              sys.exit(f"SKILL.md: frontmatter is not valid YAML: {exc}")

          if not isinstance(data, dict):
              sys.exit("SKILL.md: frontmatter did not parse to a mapping")

          errors = []
          for key in ("name", "description"):
              if key not in data:
                  errors.append(f"missing required key: {key}")

          if data.get("name") != "secure-code-auditor":
              errors.append(f"name must be 'secure-code-auditor', got {data.get('name')!r}")

          description = data.get("description")
          if not isinstance(description, str):
              errors.append(f"description must be a string, got {type(description).__name__}")
          elif not description.strip():
              errors.append("description must not be empty")
          elif len(description) >= 1024:
              errors.append(f"description must be under 1024 characters, got {len(description)}")

          if errors:
              sys.exit("SKILL.md frontmatter invalid:\n" + "\n".join(f"  - {e}" for e in errors))

          print(f"OK: name={data['name']} description={len(description)} chars")
          PY

  scanners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the dangerous_patterns self-test
        run: python scripts/dangerous_patterns.py --selftest
      - name: Every JSON stream ends with a summary record
        run: |
          python - <<'PY'
          import json, subprocess, sys

          scripts = ("dangerous_patterns.py", "settings_scan.py", "entrypoint_inventory.py")
          errors = []
          for name in scripts:
              run = subprocess.run(
                  [sys.executable, "scripts/" + name, "/nonexistent/path", "--json"],
                  capture_output=True, text=True)
              if run.returncode != 0:
                  errors.append(f"{name}: exit {run.returncode}, expected 0")
              lines = [line for line in run.stdout.splitlines() if line.strip()]
              if not lines:
                  errors.append(f"{name}: empty JSON stream on a missing path")
                  continue
              try:
                  last = json.loads(lines[-1])
              except json.JSONDecodeError as exc:
                  errors.append(f"{name}: last line is not JSON: {exc}")
                  continue
              if last.get("kind") != "summary":
                  errors.append(f"{name}: last record kind is {last.get('kind')!r}, "
                                "expected 'summary'")
              else:
                  print(f"OK: {name} -> {last}")

          if errors:
              sys.exit("scanner summary smoke check failed:\n"
                       + "\n".join(f"  - {e}" for e in errors))
          PY
